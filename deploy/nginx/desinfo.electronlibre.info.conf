limit_req_zone $binary_remote_addr zone=desinfo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=desinfo_export:10m rate=1r/s;

upstream desinfo_next {
    server 127.0.0.1:8710;
    keepalive 32;
}

upstream desinfo_api {
    server 127.0.0.1:8700;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name desinfo.electronlibre.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desinfo.electronlibre.info;

    ssl_certificate /etc/letsencrypt/live/desinfo.electronlibre.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desinfo.electronlibre.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Export PDF — Next.js HMAC proxy (must precede /api/)
    location = /api/export {
        limit_req zone=desinfo_export burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://desinfo_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=desinfo_api burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://desinfo_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://desinfo_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /_next/ {
        proxy_pass http://desinfo_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://desinfo_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
